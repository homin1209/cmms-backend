services:
  db:
    image: postgres:18
    container_name: cmms-db
    environment:
      POSTGRES_DB: cmms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - cmms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmms:latest
    container_name: cmms-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    networks:
      - cmms-network

networks:
  cmms-network:
    driver: bridge

volumes:
  postgres-data: